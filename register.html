<!DOCTYPE html>
<html>
<head>
    <title>Register Page</title>
    <link rel="stylesheet" href="index.css">
</head>

<body>

<div class="container">
    <h2>Register</h2>

    <form>
        <table>
            <tr>
                <td>Full Name</td>
            </tr>
            <tr>
                <td><input type="text" placeholder="Enter full name"></td>
            </tr>

            <tr>
                <td>Email</td>
            </tr>
            <tr>
                <td><input type="email" placeholder="Enter email"></td>
            </tr>

            <tr>
                <td>Password</td>
            </tr>
            <tr>
                <td><input type="password" placeholder="Create password"></td>
            </tr>

            <tr>
                <td>
                    <button class="register-btn" type="submit">Register</button>
                </td>
            </tr>
        </table>
    </form>
</div>

</body>
</html>
